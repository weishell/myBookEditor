allowBuilds:
  esbuild: false

# ================= 供应链安全防护（pnpm 设置，单位：分钟） =================
# 只安装「发布已满 7 天」的版本，避开"刚发布就被投毒"的恶意版本。
#
# 背景实例：2026-03-31，axios 核心维护者 npm 账号被劫持，发布了
#   axios@1.14.1 / axios@0.30.4（注入伪装依赖 plain-crypto-js@4.2.1，
#   在 postinstall 阶段投放跨平台远控木马）。恶意版本存活不到 3 小时即被下架。
#   有了 7 天冷却期，这类版本在可用窗口内根本不会被解析安装。
#
# 10080 = 7 天 × 1440 分钟。
# 命中该策略时 pnpm 会要求显式确认；确有需要时可执行
#   pnpm add <pkg>@<ver>          # 交互确认
# 或把该包加入下面的白名单：
#   minimumReleaseAgeExclude:
#     - <pkg>
minimumReleaseAge: 10080
